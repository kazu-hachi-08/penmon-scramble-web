<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>乱戦！ペンモンスクランブル</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* ゲーム画面は横長(16:9)の箱に収め、余りは黒帯にする */
    #unity-canvas { position: absolute; display: block; background: #0d1520; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #fff; font: 16px sans-serif; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">読み込み中… <span id="progress">0</span>%</div>
  <script>
    // C# の WebScreen.SetAspect から呼ばれる。ゲームは常に横画面なので最初から横に合わせておく
    var aspect = 16 / 9;
    var canvas = document.getElementById('unity-canvas');

    function fitCanvas() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = w, ch = w / aspect;
      if (ch > h) { ch = h; cw = h * aspect; }
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.left = (w - cw) / 2 + 'px';
      canvas.style.top = (h - ch) / 2 + 'px';
    }

    window.miniGameSetAspect = function (width, height) {
      aspect = width / height;
      fitCanvas();
    };

    window.addEventListener('resize', fitCanvas);
    fitCanvas();

    var buildUrl = 'Build';
    var config = {
      dataUrl: buildUrl + '/penmon-scramble-web.data.unityweb',
      frameworkUrl: buildUrl + '/penmon-scramble-web.framework.js.unityweb',
      codeUrl: buildUrl + '/penmon-scramble-web.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "kazuhachi08",
      productName: "乱戦！ペンモンスクランブル",
      productVersion: "0.1.0",
      // 高解像度スマホで等倍描画すると重いので2倍までに抑える
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    var script = document.createElement('script');
    script.src = buildUrl + '/penmon-scramble-web.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById('progress').textContent = Math.round(p * 100);
      }).then(function () {
        document.getElementById('loading').remove();
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
